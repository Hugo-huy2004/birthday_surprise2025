

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mở Quà Sinh Nhật</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            color: #bc0000;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #birthdayMessage {
            font-size: 100px;
            font-weight: bold;
            animation: fadeIn 2s ease-in-out;
        }
        input {
            padding: 10px;
            font-size: 50px;
            border-radius: 5px;
            text-align: center;
            border: 1px solid white;
            margin-top: 20px;
        }
        .btn {
            background: #ff4081;
            color: white;
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1 id="birthdayMessage">HAPPY BIRTHDAY</h1>
    <h2>Wishing you a fantastic day filled with joy, laughter, and all the things that make you happiest. May this year bring you success, good health, and endless happiness!</h2>
    <p>Nhập mã để mở vòng quay:</p>
    <input type="text" id="giftCode" placeholder="Nhập mã...">
    <button class="btn" id="confirmCode">Xác nhận</button>

    <script>
        document.getElementById("confirmCode").onclick = () => {
            if (document.getElementById("giftCode").value === "3032") {
                window.location.href = "wheel.html";
            } else {
                alert("Mã sai!");
            }
        };
    </script>

</body>
</html>
